<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ollama Chat · Portfólio</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #6ee7b7;
    --accent-2: #60a5fa;
    --text: #e5e7eb;
    --muted: #8b8fa3;
    --bubble-user: #2563eb;
    --bubble-ai: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: radial-gradient(circle at top, #1a1e27 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid #2a2f3a;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.offline { background: #f87171; }

  .chat-box {
    background: var(--panel);
    border: 1px solid #262b36;
    border-radius: 16px;
    height: 60vh;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; font-size: 0.92rem; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 0.8rem; background: transparent; }

  form { display: flex; gap: 8px; }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid #2a2f3a;
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    height: 52px;
  }
  button {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    border: none;
    color: #0f1115;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; }
  footer a { color: var(--accent-2); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🦙 Ollama Chat</h1>
      <p>Spring Boot + Java 17 + IA local via Ollama — demonstração de portfólio</p>
      <span class="badge"><span id="statusDot" class="dot"></span><span id="statusText">verificando serviço...</span></span>
    </header>

    <div class="chat-box" id="chatBox">
      <div class="msg system">Envie uma mensagem para iniciar a conversa. A resposta é transmitida em tempo real (streaming).</div>
    </div>

    <form id="chatForm">
      <textarea id="input" placeholder="Digite sua mensagem..." required></textarea>
      <button type="submit" id="sendBtn">Enviar</button>
    </form>

    <footer>API: <code>POST /api/chat/stream</code> · Sessão: <span id="sessionLabel">nova</span></footer>
  </div>

<script>
  let sessionId = crypto.randomUUID();
  document.getElementById('sessionLabel').textContent = sessionId.slice(0, 8);
  const chatBox = document.getElementById('chatBox');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const sessionLabel = document.getElementById('sessionLabel');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  function addBubble(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function checkHealth() {
    try {
      const res = await fetch('/actuator/health');
      const data = await res.json();
      if (data.status === 'UP') {
        statusDot.className = 'dot online';
        statusText.textContent = 'API online';
      } else {
        throw new Error('down');
      }
    } catch {
      statusDot.className = 'dot offline';
      statusText.textContent = 'API indisponível';
    }
  }
  checkHealth();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addBubble(message, 'user');
    input.value = '';
    sendBtn.disabled = true;

    const aiBubble = addBubble('', 'ai');

    try {
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId })
      });

      if (!res.ok || !res.body) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(errBody.message || 'Falha na requisição');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // Eventos SSE são separados por linhas "data: ..."
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data:')) {
            aiBubble.textContent += line.replace(/^data:\s?/, '');
            chatBox.scrollTop = chatBox.scrollHeight;
          }
        }
      }

    } catch (err) {
      aiBubble.textContent = '⚠️ ' + err.message;
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
